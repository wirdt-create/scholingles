<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="ESchool.css">
</head>
<body class="body-login">
    <div class="login-container">
      <a href="index.html" class="btn-regresar">Volver</a>  
      <!-- Logo -->
      <div class="logo-login">
        <img src="img/logo.png" alt="Logo Langway English School">
      </div>

      <!-- Título -->
      <h1 class="titulo1">Crear Cuenta</h1>

      <!-- Formulario -->
      <form id="registerForm">
        <div class="input-group">
          <label for="fullname">Nombre Completo</label>
          <input type="text" id="fullname" placeholder="Ingresa tu nombre completo" required>
        </div>

        <div class="input-group">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="Ingresa tu correo" required>
        </div>

        <div class="input-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Elige un usuario" required>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Crea una contraseña" required>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
        </div>
        <br>
        <button type="submit" class="btn-login">Registrarse</button>
      </form>

      <!-- Link de volver -->
      <div class="links-login">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
      </div>
      <script src="js/register.js"></script>
  </div>
</body>
</html>
